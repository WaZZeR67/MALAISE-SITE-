<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Demande envoyée | Couverture Malaisé</title>
  <style>
    :root {
      --black: #111111;
      --orange: #FF6B00;
      --white: #FFFFFF;
      --muted: #b9b9b9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(255, 107, 0, .16), transparent 32%), var(--black);
      color: var(--white);
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .06);
      padding: clamp(30px, 7vw, 64px);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 12px;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: .95;
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
      margin: 22px 0 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 4px;
      background: var(--orange);
      color: var(--white);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 14px 34px rgba(255, 107, 0, .26);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Couverture Malaisé</p>
    <h1>Demande envoyée.</h1>
    <p>Merci pour votre message. Nous revenons vers vous pour échanger sur votre projet et organiser une visite si nécessaire.</p>
    <a href="index.html">Retour au site</a>
  </main>
</body>
</html>
